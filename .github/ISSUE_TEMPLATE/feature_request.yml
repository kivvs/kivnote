name: 功能建议
description: 想增加某个能力或改进现有行为
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你碰到的实际困扰，而不是直接说要什么功能
      placeholder: 打开几十页的课件时，转很久，不知道是不是卡住了
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你建议怎么做
      placeholder: 转换时显示当前页数和进度条
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它方案
      placeholder: 或者先显示低清预览，转完再替换

  - type: select
    id: area
    attributes:
      label: 涉及的功能
      options:
        - 文本编辑
        - 表格
        - Word / docx
        - PowerPoint / pptx
        - PDF
        - 十六进制 / 二进制
        - 图片 / 音频 / 视频
        - 界面 / 标签 / 设置
        - 打包 / 安装
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 补充
      options:
        - label: 我愿意自己实现这个改动并提 PR
        - label: 这个改动可能会增加安装包体积（内置引擎已占 750 MB）
